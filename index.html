<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級榮譽積分看板</title>
<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue, push, serverTimestamp }
                          from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAgX9-ucO7zVUbQ33yuEreSJU6rKtSFfgw",
  authDomain:        "reward-16e2c.firebaseapp.com",
  databaseURL:       "https://reward-16e2c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "reward-16e2c",
  storageBucket:     "reward-16e2c.firebasestorage.app",
  messagingSenderId: "377335225949",
  appId:             "1:377335225949:web:f0d3639d19a979f108b7b4"
};
const TEACHER_PW = "1234";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── 狀態 ──
let students = {}, rewards = [], isTeacher = false, editingId = null;
let maxScore = 0, _histRecs = [];

const DEFAULT_REWARDS = [
  {id:'r1', name:'自選座位搭檔',   cost:20, emoji:'✏️',  stock:-1},
  {id:'r2', name:'全班玩遊戲一次', cost:60, emoji:'🕹️', stock:-1},
  {id:'r3', name:'老師請賞小點心', cost:30, emoji:'🍕',  stock:-1},
  {id:'r4', name:'免當值日生一次', cost:25, emoji:'⏰',  stock:-1},
  {id:'r5', name:'貼紙一張',       cost:10, emoji:'⭐',  stock:-1},
  {id:'r6', name:'糖果一顆',       cost:15, emoji:'🍬',  stock:-1},
  {id:'r7', name:'老師神秘小禮物', cost:60, emoji:'🎁',  stock:5 },
  {id:'r8', name:'文具一份',       cost:40, emoji:'🎀',  stock:-1},
  {id:'r9', name:'免寫一題作業',   cost:20, emoji:'📝',  stock:-1},
  {id:'r10',name:'免寫一頁作業',   cost:30, emoji:'📖',  stock:-1},
  {id:'r11',name:'下課不用打掃',   cost:20, emoji:'🔕',  stock:-1},
  {id:'r12',name:'課堂播音樂一首', cost:15, emoji:'🎵',  stock:-1},
];

// ── Firebase ──
function setStatus(ok) {
  const el = document.getElementById('firebase-status');
  if (!el) return;
  el.textContent = ok ? '🟢 雲端已連線' : '🔴 連線失敗';
  el.style.color  = ok ? '#86efac' : '#fca5a5';
}

function initDB() {
  onValue(ref(db,'students'), snap => {
    students = snap.val() || {};
    setStatus(true);
    renderBoard();
    document.getElementById('total-count').textContent = Object.keys(students).length;
  }, () => setStatus(false));

  onValue(ref(db,'rewards'), snap => {
    const data = snap.val();
    if (data) { rewards = Object.values(data); }
    else { rewards = DEFAULT_REWARDS; DEFAULT_REWARDS.forEach(r=>set(ref(db,`rewards/${r.id}`),r)); }
    renderShop();
  });
}

const saveStudent = (id,data) => set(ref(db,`students/${id}`),data);
const logHist     = rec => push(ref(db,'history'),{...rec, ts:serverTimestamp()});

// ── 渲染看板 ──
function renderBoard() {
  const cont   = document.getElementById('board');
  const search = document.getElementById('search-input').value.toLowerCase();
  const sorted = Object.entries(students).sort(([ia,a],[ib,b])=>{
    const sa = a.seatNo!=null?Number(a.seatNo):9999;
    const sb = b.seatNo!=null?Number(b.seatNo):9999;
    return sa!==sb ? sa-sb : ia.localeCompare(ib);
  });
  cont.style.gridTemplateColumns = 'repeat(6,1fr)';
  cont.innerHTML = '';
  if (!sorted.length) {
    cont.style.gridTemplateColumns='1fr';
    cont.innerHTML='<div style="text-align:center;color:#94a3b8;padding:3rem;font-size:16px;">還沒有學生資料，請老師登入後新增！</div>';
    return;
  }
  sorted.forEach(([id,s],idx)=>{
    if (search && !s.name.toLowerCase().includes(search)) return;
    const sn    = s.seatNo!=null?s.seatNo:idx+1;
    const stars = '⭐'.repeat(Math.min(Math.floor(s.score/10),5));
    const card  = document.createElement('div');
    card.className='student-card'; card.id=`cc-${id}`;
    card.style.animationDelay=`${idx*.04}s`;
    card.innerHTML=`
      <div class="seat-no">No.${sn}</div>
      <div class="name">${s.name}</div>
      <div class="score-wrap"><div class="score">${s.score}</div><div class="score-label">分</div></div>
      ${stars?`<div class="stars">${stars}</div>`:''}
      <div class="teacher-actions">
        <button class="btn-plus"     onclick="quickAdd('${id}',1)">＋1</button>
        <button class="btn-plus big" onclick="quickAdd('${id}',5)">＋5</button>
        <button class="btn-minus"    onclick="quickAdd('${id}',-1)">－1</button>
        ${isTeacher?`<button class="btn-edit" onclick="openEdit('${id}')">✏️</button>`:''}
      </div>`;
    cont.appendChild(card);
  });
}

// ── 加減分 ──
window.quickAdd = async function(id,delta){
  const s=students[id];
  const newSc=Math.max(0,(s.score||0)+delta);
  students[id]={...s,score:newSc};
  const el=document.querySelector(`#cc-${id} .score`);
  if(el) el.textContent=newSc;
  await saveStudent(id,{...s,score:newSc});
  await logHist({studentId:id,name:s.name,delta,reason:delta>0?'快速加分':'快速扣分'});
  toast(`${s.name} ${delta>0?'＋':''}${delta} 分 → ${newSc} 分`);
};

// ── 編輯 ──
window.openEdit = function(id){
  editingId=id; const s=students[id];
  document.getElementById('edit-name').value  = s.name;
  document.getElementById('edit-score').value = s.score;
  document.getElementById('edit-seat').value  = s.seatNo??'';
  document.getElementById('edit-delta').value = '';
  document.getElementById('edit-reason').value= '';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('edit-modal').classList.add('show');
};
window.closeEdit = ()=>{ document.getElementById('edit-modal').classList.remove('show'); editingId=null; };
window.saveEdit  = async function(){
  if(!editingId) return;
  const name   = document.getElementById('edit-name').value.trim();
  const score  = parseInt(document.getElementById('edit-score').value)||0;
  const seatNo = document.getElementById('edit-seat').value!==''?parseInt(document.getElementById('edit-seat').value):null;
  const delta  = parseInt(document.getElementById('edit-delta').value)||0;
  const reason = document.getElementById('edit-reason').value.trim()||'老師手動調整';
  const finalSc= Math.max(0,delta?(score+delta):score);
  await saveStudent(editingId,{name,score:finalSc,seatNo});
  if(delta) await logHist({studentId:editingId,name,delta,reason});
  toast(`已儲存：${name} = ${finalSc} 分`);
  window.closeEdit();
};
window.deleteStudent = async function(id){
  const s=students[id]; if(!s) return;
  if(!confirm(`確定要刪除「${s.name}」嗎？`)) return;
  await set(ref(db,`students/${id}`),null);
  window.closeEdit(); toast(`已刪除：${s.name}`);
};

// ── 新增學生 ──
window.addStudent = async function(){
  const nameEl=document.getElementById('new-name');
  const seatEl=document.getElementById('new-seat');
  const name=nameEl.value.trim();
  if(!name){ toast('請輸入學生姓名','error'); return; }
  const seatNo=seatEl.value?parseInt(seatEl.value):null;
  await saveStudent('stu_'+Date.now(),{name,score:0,seatNo});
  nameEl.value=''; seatEl.value='';
  toast(`已新增：${name}`);
};
window.batchAdd = async function(){
  const raw=document.getElementById('batch-names').value.trim(); if(!raw) return;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const parts=line.split(/[\s\t]+/);
    let seatNo=null,name=line;
    if(parts.length>=2&&/^\d+$/.test(parts[0])){ seatNo=parseInt(parts[0]); name=parts.slice(1).join(' '); }
    await saveStudent('stu_'+Date.now()+Math.random().toString(36).slice(2,5),{name,score:0,seatNo});
  }
  document.getElementById('batch-names').value='';
  toast(`已新增 ${lines.length} 位學生！`);
  document.getElementById('batch-modal').classList.remove('show');
};
window.deleteAllStudents = async function(){
  const c=Object.keys(students).length; if(!c){ toast('目前沒有學生資料','error'); return; }
  if(!confirm(`⚠️ 確定要刪除全部 ${c} 位學生嗎？此操作無法復原！`)) return;
  await set(ref(db,'students'),null); toast(`已刪除全部 ${c} 位學生`);
};
window.resetAllScores = async function(){
  const c=Object.keys(students).length; if(!c){ toast('目前沒有學生資料','error'); return; }
  if(!confirm(`⚠️ 確定要將全部 ${c} 位學生的積分歸零嗎？`)) return;
  const upd={};
  Object.entries(students).forEach(([id,s])=>{ upd[id]={...s,score:0}; });
  await set(ref(db,'students'),upd);
  await logHist({studentId:'ALL',name:'全班',delta:0,reason:'全班積分歸零'});
  toast('✅ 全班積分已歸零！');
};

// ── 商店 ──
function renderShop(){
  const grid=document.getElementById('shop-grid'); if(!grid) return;
  grid.innerHTML='';
  rewards.forEach(r=>{
    const sold=r.stock===0;
    const card=document.createElement('div'); card.className='reward-card';
    card.innerHTML=`
      <div class="reward-emoji">${r.emoji}</div>
      <div class="reward-name">${r.name}</div>
      <div class="reward-cost">🌟 ${r.cost} 分</div>
      ${r.stock>=0?`<div class="reward-stock">剩餘：${r.stock}</div>`:''}
      ${sold?'<div class="reward-sold">已兌完</div>':''}
      ${isTeacher&&!sold?`<button class="mbtn mbtn-ok" style="margin-top:8px;width:100%;font-size:13px" onclick="openRedeem('${r.id}')">為學生兌換</button>`:''}`;
    grid.appendChild(card);
  });
  const mb=document.getElementById('btn-manage-rewards');
  if(mb) mb.style.display=isTeacher?'inline-block':'none';
}
window.openRedeem = function(rid){
  const r=rewards.find(x=>x.id===rid); if(!r) return;
  document.getElementById('redeem-reward-name').textContent=`${r.emoji} ${r.name}（${r.cost} 分）`;
  document.getElementById('redeem-reward-id').value=rid;
  document.getElementById('redeem-student-select').innerHTML=
    '<option value="">— 選擇學生 —</option>'+
    Object.entries(students).sort(([,a],[,b])=>b.score-a.score)
      .map(([id,s])=>`<option value="${id}">${s.name}（${s.score} 分）</option>`).join('');
  document.getElementById('redeem-modal').classList.add('show');
};
window.confirmRedeem = async function(){
  const rid=document.getElementById('redeem-reward-id').value;
  const sid=document.getElementById('redeem-student-select').value;
  if(!sid){ toast('請選擇學生','error'); return; }
  const r=rewards.find(x=>x.id===rid), s=students[sid];
  if(!r||!s) return;
  if(s.score<r.cost){ toast(`${s.name} 積分不足！需要 ${r.cost} 分，目前 ${s.score} 分`,'error'); return; }
  const newSc=s.score-r.cost;
  await saveStudent(sid,{...s,score:newSc});
  await logHist({studentId:sid,name:s.name,delta:-r.cost,reason:`兌換：${r.name}`});
  if(r.stock>0) await set(ref(db,`rewards/${rid}/stock`),r.stock-1);
  toast(`✅ ${s.name} 兌換「${r.name}」！剩餘 ${newSc} 分`);
  document.getElementById('redeem-modal').classList.remove('show');
};
window.addReward = async function(){
  const name=document.getElementById('new-reward-name').value.trim();
  if(!name){ toast('請輸入獎品名稱','error'); return; }
  const id='r_'+Date.now();
  await set(ref(db,`rewards/${id}`),{
    id, name, emoji:document.getElementById('new-reward-emoji').value.trim()||'🎁',
    cost:parseInt(document.getElementById('new-reward-cost').value)||10,
    stock:parseInt(document.getElementById('new-reward-stock').value)||(-1)
  });
  ['new-reward-name','new-reward-cost','new-reward-emoji','new-reward-stock'].forEach(x=>document.getElementById(x).value='');
  toast(`已新增獎品：${name}`);
};
window.deleteReward = async function(id){
  if(!confirm('確定刪除這個獎品？')) return;
  await set(ref(db,`rewards/${id}`),null); toast('已刪除獎品');
};

// ── 商店管理清單 ──
window.renderShopAndManage = function(){
  renderShop();
  const ml=document.getElementById('manage-list'); if(!ml) return;
  ml.innerHTML=rewards.length?rewards.map(r=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid #f1f5f9">
      <span style="font-size:20px">${r.emoji}</span>
      <span style="flex:1;font-size:14px;color:#1e293b">${r.name}</span>
      <span style="font-size:13px;color:#6366f1;font-weight:bold">${r.cost}分</span>
      <span style="font-size:12px;color:#94a3b8">${r.stock<0?'無限':r.stock+'個'}</span>
      <button onclick="deleteReward('${r.id}')" style="background:#fee2e2;border:none;border-radius:6px;color:#991b1b;padding:3px 8px;font-size:12px;cursor:pointer">刪除</button>
    </div>`).join(''):'<div style="color:#94a3b8;font-size:13px">尚無獎品</div>';
};

// ── 歷程 ──
window.openHistory = async function(){
  const list=document.getElementById('history-list');
  list.innerHTML='<div style="color:#94a3b8;text-align:center;padding:2rem">載入中…</div>';
  document.getElementById('history-modal').classList.add('show');
  const snap=await get(ref(db,'history'));
  _histRecs=Object.values(snap.val()||{}).sort((a,b)=>(b.ts||0)-(a.ts||0));
  document.getElementById('history-count').textContent=`共 ${_histRecs.length} 筆`;
  list.innerHTML=_histRecs.length?_histRecs.map(r=>{
    const d=r.ts?new Date(r.ts):null;
    const t=d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'—';
    const c=r.delta>0?'#065f46':'#991b1b', bg=r.delta>0?'#d1fae5':'#fee2e2';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #f1f5f9;font-size:14px">
      <span style="color:#94a3b8;min-width:110px;font-size:12px">${t}</span>
      <span style="flex:1;font-weight:bold;color:#1e293b">${r.name}</span>
      <span style="background:${bg};color:${c};font-weight:900;border-radius:6px;padding:2px 8px;min-width:36px;text-align:center">${r.delta>0?'+':''}${r.delta}</span>
      <span style="color:#64748b;font-size:12px;max-width:120px;text-align:right">${r.reason||''}</span>
    </div>`;
  }).join(''):'<div style="color:#94a3b8;text-align:center;padding:2rem">尚無記錄</div>';
};
window.exportHistoryExcel = function(){
  if(!_histRecs.length){ toast('尚無歷程資料','error'); return; }
  const rows=['\uFEFF時間,姓名,加減分,原因'];
  _histRecs.forEach(r=>{
    const d=r.ts?new Date(r.ts):null;
    const t=d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'—';
    rows.push(`${t},${r.name},${r.delta>0?'+'+r.delta:r.delta},${(r.reason||'').replace(/,/g,'、')}`);
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`加分歷程_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.csv`;
  a.click(); toast('✅ 已下載歷程 CSV！');
};
window.exportCSV = function(){
  const sorted=Object.entries(students).sort(([,a],[,b])=>{
    const sa=a.seatNo!=null?Number(a.seatNo):9999, sb=b.seatNo!=null?Number(b.seatNo):9999;
    return sa-sb;
  });
  const csv='\uFEFF座號,姓名,積分\n'+sorted.map(([,s])=>`${s.seatNo||''},${s.name},${s.score}`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`班級積分_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.csv`;
  a.click(); toast('✅ 已匯出 CSV！');
};

// ── 登入 ──
window.teacherLogin = function(){
  document.getElementById('pw-input').value='';
  document.getElementById('pw-error').style.display='none';
  document.getElementById('pw-modal').classList.add('show');
  setTimeout(()=>document.getElementById('pw-input').focus(),100);
};
window.confirmPassword = function(){
  const pw=document.getElementById('pw-input').value;
  if(pw===TEACHER_PW){
    document.getElementById('pw-modal').classList.remove('show');
    isTeacher=true;
    document.getElementById('teacher-bar').style.display='flex';
    document.getElementById('btn-login').style.display='none';
    document.getElementById('btn-logout').style.display='inline-block';
    toast('老師模式已開啟 ✅'); renderBoard(); renderShop();
  } else {
    document.getElementById('pw-error').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
};
window.teacherLogout = function(){
  isTeacher=false;
  document.getElementById('teacher-bar').style.display='none';
  document.getElementById('btn-login').style.display='inline-block';
  document.getElementById('btn-logout').style.display='none';
  renderBoard(); renderShop();
};

// ── Toast ──
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast show ${type}`;
  setTimeout(()=>t.className='toast',2500);
}

// ── 初始化 ──
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('search-input').addEventListener('input',renderBoard);
  initDB();
});

// ── 原因標籤 ──
window.pickReason = function(el,text){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('edit-reason').value=text;
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:#f0f4ff;min-height:100vh;color:#1e293b}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.header-title{font-size:24px;font-weight:900;color:#fff;letter-spacing:1px}
.header-sub{font-size:13px;color:#c4b5fd;margin-top:2px}
.header-btns{display:flex;gap:8px;align-items:center}
.hbtn{padding:7px 16px;border-radius:20px;border:none;font-size:14px;font-weight:bold;cursor:pointer;transition:transform .1s}
.hbtn:hover{transform:scale(1.05)}
.hbtn-login{background:#fff;color:#6366f1}
.hbtn-logout{background:rgba(255,255,255,.2);color:#fff;display:none}
.stats-row{display:flex;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;align-items:center}
.stat-chip{background:#f1f5f9;border-radius:10px;padding:8px 16px;font-size:13px;color:#64748b;font-weight:bold}
.stat-chip span{font-size:18px;color:#6366f1;margin-left:4px}
.teacher-bar{display:none;background:#fef3c7;border-bottom:2px solid #fbbf24;padding:10px 20px;gap:8px;align-items:center;flex-wrap:wrap}
.teacher-bar h3{font-size:14px;color:#92400e;font-weight:bold}
.tb-input{padding:7px 10px;border:1.5px solid #fbbf24;border-radius:8px;font-size:14px;background:#fff}
.tb-btn{padding:7px 12px;border-radius:8px;border:none;font-size:13px;font-weight:bold;cursor:pointer;transition:transform .1s;color:#fff}
.tb-btn:hover{transform:scale(1.04)}
.search-bar{padding:10px 20px;background:#fff;border-bottom:1px solid #e2e8f0}
.search-bar input{width:100%;max-width:380px;padding:9px 14px;border:1.5px solid #c7d2fe;border-radius:20px;font-size:15px;outline:none}
.search-bar input:focus{border-color:#6366f1}
#board{padding:16px 20px;display:grid;gap:12px}
.student-card{background:#fff;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.07);animation:cardIn .3s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.seat-no{font-size:11px;font-weight:bold;color:#94a3b8;background:#f1f5f9;border-radius:20px;padding:2px 8px;align-self:flex-start}
.name{font-size:24px;font-weight:bold;color:#1e293b;text-align:center;word-break:break-all}
.score-wrap{display:flex;align-items:baseline;gap:3px}
.score{font-size:36px;font-weight:900;color:#6366f1;line-height:1}
.score-label{font-size:13px;color:#94a3b8;font-weight:bold}
.stars{font-size:13px;letter-spacing:1px}
.teacher-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px;width:100%}
.btn-plus,.btn-minus,.btn-edit{padding:12px 2px;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;width:100%}
.btn-plus{background:#059669;color:#fff}
.big{background:#10b981;color:#fff;font-size:16px}
.btn-minus{background:#dc2626;color:#fff}
.btn-edit{background:#6366f1;color:#fff;grid-column:span 3;padding:8px;font-size:14px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:900;color:#1e293b}
.modal label{font-size:13px;color:#64748b;font-weight:bold;display:block;margin-bottom:4px}
.modal input,.modal textarea,.modal select{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:#6366f1;outline:none}
.modal textarea{min-height:80px;resize:vertical}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.mbtn{padding:9px 20px;border-radius:10px;border:none;font-size:14px;font-weight:bold;cursor:pointer}
.mbtn-ok{background:#6366f1;color:#fff}
.mbtn-cancel{background:#f1f5f9;color:#64748b}
.reason-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid #c7d2fe;background:#f5f3ff;color:#4338ca;font-size:13px;cursor:pointer}
.chip.active{background:#6366f1;color:#fff;border-color:#6366f1}
.reward-card{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(0,0,0,.07);text-align:center;border:0.5px solid #e2e8f0}
.reward-emoji{font-size:34px}.reward-name{font-size:14px;font-weight:bold;color:#1e293b}
.reward-cost{font-size:13px;color:#6366f1;font-weight:bold}
.reward-stock{font-size:12px;color:#94a3b8}
.reward-sold{font-size:12px;color:#dc2626;font-weight:bold;background:#fee2e2;border-radius:6px;padding:2px 8px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:bold;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#dc2626}
</style>
</head>
<body>
<header>
  <div>
    <div class="header-title">🏆 班級榮譽積分看板</div>
    <div class="header-sub" id="firebase-status">連線中…</div>
  </div>
  <div class="header-btns">
    <button class="hbtn hbtn-login" id="btn-login" onclick="teacherLogin()">🔑 老師登入</button>
    <button class="hbtn hbtn-logout" id="btn-logout" onclick="teacherLogout()">登出</button>
  </div>
</header>

<div class="stats-row">
  <div class="stat-chip">學生人數<span id="total-count">0</span></div>
</div>

<div class="teacher-bar" id="teacher-bar">
  <h3>🛠️ 老師工具：</h3>
  <input class="tb-input" id="new-seat" type="number" placeholder="座號" style="width:65px">
  <input class="tb-input" id="new-name" placeholder="學生姓名" style="width:120px" onkeydown="if(event.key==='Enter')addStudent()">
  <button class="tb-btn" style="background:#6366f1" onclick="addStudent()">新增學生</button>
  <button class="tb-btn" style="background:#8b5cf6" onclick="document.getElementById('batch-modal').classList.add('show')">批次匯入</button>
  <button class="tb-btn" style="background:#dc2626" onclick="deleteAllStudents()">🗑️ 刪除全部</button>
  <button class="tb-btn" style="background:#b45309" onclick="resetAllScores()">🔄 積分歸零</button>
  <button class="tb-btn" style="background:#0f766e" onclick="exportCSV()">📥 匯出CSV</button>
  <button class="tb-btn" style="background:#4f46e5" onclick="openHistory()">📋 加分歷程</button>
</div>

<div class="search-bar"><input id="search-input" placeholder="🔍 搜尋學生姓名…"></div>
<div id="board"></div>

<div style="padding:14px 20px 4px;display:flex;align-items:center;justify-content:space-between">
  <div style="font-size:18px;font-weight:900;color:#1e293b">🛒 獎勵兌換商店</div>
  <button id="btn-manage-rewards" class="tb-btn" style="background:#8b5cf6;display:none" onclick="document.getElementById('manage-modal').classList.add('show')">⚙️ 管理獎品</button>
</div>
<div id="shop-grid" style="padding:8px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px"></div>

<!-- 密碼 Modal -->
<div class="overlay" id="pw-modal">
  <div class="modal" style="max-width:320px">
    <h2 style="text-align:center">🔑 老師登入</h2>
    <div>
      <label>請輸入密碼</label>
      <input id="pw-input" type="password" placeholder="••••••" style="text-align:center;letter-spacing:4px;font-size:20px" onkeydown="if(event.key==='Enter')confirmPassword()">
      <div id="pw-error" style="display:none;color:#dc2626;font-size:13px;margin-top:6px;text-align:center;font-weight:bold">❌ 密碼錯誤，請再試一次</div>
    </div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="document.getElementById('pw-modal').classList.remove('show')">取消</button>
      <button class="mbtn mbtn-ok" onclick="confirmPassword()">確認登入</button>
    </div>
  </div>
</div>

<!-- 編輯 Modal -->
<div class="overlay" id="edit-modal">
  <div class="modal">
    <h2>✏️ 編輯學生</h2>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:8px">
      <div><label>座號</label><input id="edit-seat" type="number" min="1" placeholder="座號"></div>
      <div><label>姓名</label><input id="edit-name" type="text"></div>
    </div>
    <div><label>目前分數</label><input id="edit-score" type="number" min="0"></div>
    <div><label>加減分（可留空）</label><input id="edit-delta" type="number" placeholder="+3 或 -2"></div>
    <div>
      <label>加分原因</label>
      <div class="reason-chips">
        <span class="chip" onclick="pickReason(this,'舉手發言')">舉手發言</span>
        <span class="chip" onclick="pickReason(this,'繳交作業')">繳交作業</span>
        <span class="chip" onclick="pickReason(this,'幫助同學')">幫助同學</span>
        <span class="chip" onclick="pickReason(this,'表現優秀')">表現優秀</span>
        <span class="chip" onclick="pickReason(this,'回答問題')">回答問題</span>
      </div>
      <input id="edit-reason" type="text" placeholder="或自由輸入原因…" style="margin-top:8px">
    </div>
    <div class="modal-btns" style="justify-content:space-between">
      <button class="mbtn" style="background:#fee2e2;color:#991b1b" onclick="deleteStudent(editingId)">🗑️ 刪除</button>
      <div style="display:flex;gap:8px">
        <button class="mbtn mbtn-cancel" onclick="closeEdit()">取消</button>
        <button class="mbtn mbtn-ok" onclick="saveEdit()">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- 批次匯入 Modal -->
<div class="overlay" id="batch-modal">
  <div class="modal">
    <h2>📋 批次匯入學生</h2>
    <div>
      <label>每行一人，格式：「座號 姓名」或純姓名</label>
      <textarea id="batch-names" placeholder="1 小明&#10;2 小華&#10;3 小美"></textarea>
    </div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="document.getElementById('batch-modal').classList.remove('show')">取消</button>
      <button class="mbtn mbtn-ok" onclick="batchAdd()">匯入</button>
    </div>
  </div>
</div>

<!-- 兌換 Modal -->
<div class="overlay" id="redeem-modal">
  <div class="modal">
    <h2>🎁 為學生兌換獎勵</h2>
    <div style="background:#f1f5f9;border-radius:10px;padding:12px;font-size:15px;font-weight:bold;color:#4338ca;text-align:center" id="redeem-reward-name"></div>
    <input type="hidden" id="redeem-reward-id">
    <div><label>選擇學生</label>
      <select id="redeem-student-select" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px"></select>
    </div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="document.getElementById('redeem-modal').classList.remove('show')">取消</button>
      <button class="mbtn mbtn-ok" onclick="confirmRedeem()">確認兌換 ✅</button>
    </div>
  </div>
</div>

<!-- 管理獎品 Modal -->
<div class="overlay" id="manage-modal">
  <div class="modal" style="max-width:520px">
    <h2>⚙️ 管理獎品清單</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>獎品名稱</label><input id="new-reward-name" placeholder="例如：貼紙一張"></div>
      <div><label>Emoji 圖示</label><input id="new-reward-emoji" placeholder="例如 🎁"></div>
      <div><label>所需積分</label><input id="new-reward-cost" type="number" min="1" placeholder="20"></div>
      <div><label>庫存（-1=無限）</label><input id="new-reward-stock" type="number" placeholder="-1"></div>
    </div>
    <button class="mbtn mbtn-ok" onclick="addReward()" style="width:100%">➕ 新增獎品</button>
    <div style="border-top:1px solid #e2e8f0;padding-top:12px">
      <div style="font-size:13px;color:#64748b;font-weight:bold;margin-bottom:8px">現有獎品</div>
      <div id="manage-list"></div>
    </div>
    <div class="modal-btns"><button class="mbtn mbtn-cancel" onclick="document.getElementById('manage-modal').classList.remove('show')">關閉</button></div>
  </div>
</div>

<!-- 歷程 Modal -->
<div class="overlay" id="history-modal">
  <div class="modal" style="max-width:540px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2>📋 加分歷程</h2>
      <span id="history-count" style="font-size:13px;color:#94a3b8"></span>
    </div>
    <div id="history-list" style="max-height:55vh;overflow-y:auto"></div>
    <div class="modal-btns">
      <button class="mbtn" style="background:#059669;color:#fff" onclick="exportHistoryExcel()">📥 下載 Excel</button>
      <button class="mbtn mbtn-cancel" onclick="document.getElementById('history-modal').classList.remove('show')">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
